<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Classroom - Happy Teachers Day</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        #loading { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 20px; color: #333; 
        }
    </style>
</head>
<body>
    <div id="loading">Loading classroom...</div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0); // Light grey background like the image

        // 2. Camera Setup (Mimicking the view in the image)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Positioned towards the back of the classroom, looking at the chalkboard
        camera.position.set(0, 2.2, 7); 
        camera.lookAt(0, 1.8, 0);

        // 3. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 4. Controls (Allows user to rotate around the classroom)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.8, 0);
        controls.update();

        // 5. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 6. Chalkboard Text Generator
        function createChalkboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Chalkboard Green Background
            ctx.fillStyle = '#2e5c31'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw "Happy Teachers Day" with a chalk-like style
            ctx.font = 'bold 55px "Comic Sans MS", cursive, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Add a slight shadow/blur to look more like chalk
            ctx.shadowColor = 'rgba(255,255,255,0.5)';
            ctx.shadowBlur = 10;
            ctx.fillText("Happy Teachers Day", canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }

        // 7. Load the 3D Model
        const loader = new GLTFLoader();
        
        loader.load(
            'low_poly_classroom.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                // Enable shadows on all meshes
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                // Try to find the chalkboard mesh
                let boardMesh = null;
                model.traverse((child) => {
                    if (child.isMesh) {
                        const name = child.name.toLowerCase();
                        // Look for common names for chalkboards
                        if (name.includes('board') || name.includes('chalk') || name.includes('blackboard')) {
                            boardMesh = child;
                        }
                    }
                });

                // If a chalkboard was found, apply the "Happy Teachers Day" texture
                if (boardMesh) {
                    const chalkTexture = createChalkboardTexture();
                    
                    // Handle both single and multi-materials
                    const materials = Array.isArray(boardMesh.material) ? boardMesh.material : [boardMesh.material];
                    materials.forEach(mat => {
                        mat.map = chalkTexture;
                        mat.needsUpdate = true;
                    });
                    console.log("Success: Text written on the chalkboard!");
                } else {
                    // Fallback: If no mesh named 'board' is found, place a text plane in front
                    console.log("Chalkboard not found. Placing text plane at default front position.");
                    
                    const chalkTexture = createChalkboardTexture();
                    const planeMat = new THREE.MeshBasicMaterial({ map: chalkTexture, transparent: true });
                    const planeGeom = new THREE.PlaneGeometry(5, 2.5);
                    const textPlane = new THREE.Mesh(planeGeom, planeMat);
                    
                    // Assuming the front of the class is at Z = -5
                    textPlane.position.set(0, 2.2, -4.9); 
                    scene.add(textPlane);
                }

                scene.add(model);
                document.getElementById('loading').style.display = 'none';
            },
            undefined, 
            function (error) {
                console.error(error);
                document.getElementById('loading').textContent = 'Failed to load low_poly_classroom.glb. Please ensure the file is in the same directory.';
            }
        );

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 9. Window Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the loop
        animate();
    </script>
</body>
</html>
