<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise - Happy Teachers Day</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #loading { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 24px; 
            font-family: sans-serif; 
            color: #333; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Preparing the classroom...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        // Camera matching your exact view
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 8); 
        camera.lookAt(0, 2.5, -6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.5, -6);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function createWhiteboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 70px "Comic Sans MS", cursive, sans-serif';
            ctx.fillStyle = '#333333'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 8;
            ctx.fillText("Happy Teachers Day", canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }

        const loader = new GLTFLoader();
        
        loader.load('low_poly_classroom.glb', function (gltf) {
            const model = gltf.scene;
            
            model.traverse((child) => { 
                if (child.isMesh) { 
                    child.castShadow = true; 
                    child.receiveShadow = true; 
                } 
            });

            scene.add(model);

            // Process the model
            requestAnimationFrame(() => {
                const meshes = [];
                model.traverse((child) => { if (child.isMesh) meshes.push(child); });

                // 1. HIDE THE GREEN BOARD (Right wall)
                meshes.forEach(mesh => {
                    if (mesh.material && mesh.material.color) {
                        const c = mesh.material.color;
                        // If very green, hide it
                        if (c.g > 0.2 && c.g > c.r + 0.1 && c.g > c.b + 0.1) {
                            mesh.visible = false;
                        }
                    }
                });

                // 2. CLEAN UP: Remove textures from floating meshes (like that tiny white cube)
                meshes.forEach(mesh => {
                    // If it is in the middle of the room (Z between -2 and 5) AND has a map...
                    if (mesh.position.z > -2 && mesh.material && mesh.material.map) {
                        mesh.material.map = null; // Remove the floating text
                        mesh.material.needsUpdate = true;
                    }
                });

                // 3. PLACE NEW PERFECT WHITEBOARD EXACTLY ON FRONT WALL
                // Using MeshBasicMaterial so it is always perfectly visible
                const texture = createWhiteboardTexture();
                const newBoard = new THREE.Mesh(
                    new THREE.PlaneGeometry(6, 3), // Large board size
                    new THREE.MeshBasicMaterial({ map: texture })
                );
                // Placed exactly where the blank white board is (front wall)
                // Z is -5.9, slightly in front of the wall to avoid z-fighting
                newBoard.position.set(0, 2.6, -5.9); 
                
                // DO NOT ROTATE. It faces positive Z (towards the camera)
                scene.add(newBoard);

                document.getElementById('loading').style.display = 'none';
            });

        }, undefined, function (error) {
            console.error("Error loading model:", error);
            document.getElementById('loading').textContent = 'Error: Please make sure "low_poly_classroom.glb" is in the same folder.';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
