<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise - Happy Teachers Day</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #loading { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 24px; 
            font-family: sans-serif; 
            color: #333; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Preparing the classroom...</div>

    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        // 2. Camera (Student Desk View - looking directly at the front whiteboard)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Positioned at a student's desk, slightly lower height, looking straight at the front (Z negative)
        camera.position.set(-2, 1.8, 4.5); 
        camera.lookAt(-2, 2.0, -6);

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 4. Controls (Allows looking around the room)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(-2, 2.0, -6);
        controls.update();

        // 5. Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 6. Create Whiteboard Texture
        function createWhiteboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Pure white board
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Write the message
            ctx.font = 'bold 60px "Comic Sans MS", cursive, sans-serif';
            ctx.fillStyle = '#333333'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 8;
            ctx.fillText("Happy Teachers Day", canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }

        // 7. Load the Model
        const loader = new GLTFLoader();
        
        loader.load('low_poly_classroom.glb', function (gltf) {
            const model = gltf.scene;
            
            // Enable shadows
            model.traverse((child) => { 
                if (child.isMesh) { 
                    child.castShadow = true; 
                    child.receiveShadow = true; 
                } 
            });

            scene.add(model);

            // --- AUTOMATIC SURPRISE LOGIC (Wait 1 frame for materials) ---
            requestAnimationFrame(() => {
                let greenBoardMesh = null;
                let whiteBoardMesh = null;
                
                const meshes = [];
                model.traverse((child) => { if (child.isMesh) meshes.push(child); });

                // A) Find and Delete the Greenest Mesh (Green board)
                let maxGreenScore = -1;
                meshes.forEach(mesh => {
                    if (mesh.material && mesh.material.color) {
                        const c = mesh.material.color;
                        const score = c.g - c.r - c.b;
                        if (score > maxGreenScore) {
                            maxGreenScore = score;
                            greenBoardMesh = mesh;
                        }
                    }
                });
                if (greenBoardMesh) greenBoardMesh.visible = false;

                // B) Find the Whiteboard (Largest, brightest mesh on the front wall at Z < -2)
                let maxWhiteSize = -1;
                meshes.forEach(mesh => {
                    if (mesh.material && mesh.material.color && mesh.position.z < -2) {
                        // Calculate approximate size of the mesh bounding box to find the big board
                        const box = new THREE.Box3().setFromObject(mesh);
                        const size = box.getSize(new THREE.Vector3());
                        const area = size.x * size.y;

                        // Prioritize large areas that are also fairly bright
                        const brightness = (mesh.material.color.r + mesh.material.color.g + mesh.material.color.b);
                        const score = area + (brightness * 10); 

                        if (score > maxWhiteSize) {
                            maxWhiteSize = score;
                            whiteBoardMesh = mesh;
                        }
                    }
                });

                // C) Apply the text
                if (whiteBoardMesh) {
                    const texture = createWhiteboardTexture();
                    const mats = Array.isArray(whiteBoardMesh.material) ? whiteBoardMesh.material : [whiteBoardMesh.material];
                    mats.forEach(mat => {
                        mat.map = texture;
                        mat.needsUpdate = true;
                    });
                } else {
                    // BULLETPROOF FAILSAFE: Place a physical whiteboard mesh directly in front of the desks
                    console.log("Whiteboard not found. Placing a new one in front of the desks.");
                    const texture = createWhiteboardTexture();
                    const newBoard = new THREE.Mesh(
                        new THREE.PlaneGeometry(5, 2.5),
                        new THREE.MeshBasicMaterial({ map: texture })
                    );
                    // Front wall location
                    newBoard.position.set(-2, 2.0, -5.8);
                    scene.add(newBoard);
                }

                // Remove loading text
                document.getElementById('loading').style.display = 'none';
            });

        }, undefined, function (error) {
            console.error("Error loading model:", error);
            document.getElementById('loading').textContent = 'Error: Please make sure "low_poly_classroom.glb" is in the same folder.';
        });

        // 8. Animate
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 9. Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
