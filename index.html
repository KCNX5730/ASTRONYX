<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCNX Games</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#1a1a1a;
    color:white;
}

header{
    background:#0078ff;
    padding:18px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card{
    width:230px;
    background:#2b2b2b;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,.4);
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#444;
}

.card h2{
    text-align:center;
    margin:15px 0 8px;
}

.card p{
    text-align:center;
    color:#ccc;
    margin-bottom:15px;
}

.card button{
    display:block;
    width:85%;
    margin:0 auto 18px;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.card button:hover{
    background:#00d39f;
}
</style>
</head>

<body>

<header>🎮 KCNX Games</header>

<div class="games">

<div class="card">
<img src="https://placehold.co/400x250?text=Image+Not+Found" alt="Image Not Found">
<h2>GTA VC</h2>
<p>Click Play to launch.</p>
<button onclick="window.location.href='https://vcgame.studynotes.top/  '">Play</button>
</div>

<div class="card">
<img src="https://placehold.co/400x250?text=Image+Not+Found" alt="Image Not Found">
<h2>Minecraft Java Edition</h2>
<p>Click Play to launch.</p>
<button onclick="window.location.href=' https://quenq.com/apps/minecraft/ '">Play</button>
</div>

</div>

</body>
  </html>
