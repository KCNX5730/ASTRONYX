<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise - Happy Teachers Day</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
        canvas { display: block; }
        #loading { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 24px; 
            font-family: sans-serif; 
            color: #333; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Preparing the classroom...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f0f0);

        // --- CAMERA: EXACT STUDENT VIEW MATCHING YOUR IMAGE ---
        // Positioned at the back center, looking straight at the front whiteboard
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 8); 
        camera.lookAt(0, 2.5, -6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 2.5, -6);
        controls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function createWhiteboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 60px "Comic Sans MS", cursive, sans-serif';
            ctx.fillStyle = '#333333'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 8;
            ctx.fillText("Happy Teachers Day", canvas.width / 2, canvas.height / 2);
            
            return new THREE.CanvasTexture(canvas);
        }

        const loader = new GLTFLoader();
        
        loader.load('low_poly_classroom.glb', function (gltf) {
            const model = gltf.scene;
            
            model.traverse((child) => { 
                if (child.isMesh) { 
                    child.castShadow = true; 
                    child.receiveShadow = true; 
                } 
            });

            scene.add(model);

            // Wait for the model to be ready
            requestAnimationFrame(() => {
                let greenBoardMesh = null;
                let whiteBoardMesh = null;
                
                const meshes = [];
                model.traverse((child) => { if (child.isMesh) meshes.push(child); });

                // A) Find the Greenest Mesh (Green board on the right wall)
                let maxGreenScore = -1;
                meshes.forEach(mesh => {
                    if (mesh.material && mesh.material.color) {
                        const c = mesh.material.color;
                        const score = c.g - c.r - c.b;
                        if (score > maxGreenScore) {
                            maxGreenScore = score;
                            greenBoardMesh = mesh;
                        }
                    }
                });
                if (greenBoardMesh) greenBoardMesh.visible = false;

                // B) Find the Whiteboard (Mesh on the front wall facing us)
                // Front wall is where Z is negative (Looking at -6)
                let bestScore = -1;
                meshes.forEach(mesh => {
                    if (mesh.material && mesh.material.color && mesh.position.z < -3) {
                        const box = new THREE.Box3().setFromObject(mesh);
                        const size = box.getSize(new THREE.Vector3());
                        const area = size.x * size.y;
                        const brightness = (mesh.material.color.r + mesh.material.color.g + mesh.material.color.b);
                        const score = area + (brightness * 10); 

                        if (score > bestScore) {
                            bestScore = score;
                            whiteBoardMesh = mesh;
                        }
                    }
                });

                // C) Apply the text
                if (whiteBoardMesh) {
                    const texture = createWhiteboardTexture();
                    const mats = Array.isArray(whiteBoardMesh.material) ? whiteBoardMesh.material : [whiteBoardMesh.material];
                    mats.forEach(mat => {
                        mat.map = texture;
                        mat.needsUpdate = true;
                    });
                } else {
                    // FALLBACK: Place text plane directly on the front wall (facing the camera)
                    const texture = createWhiteboardTexture();
                    const newBoard = new THREE.Mesh(
                        new THREE.PlaneGeometry(5, 2.5),
                        new THREE.MeshBasicMaterial({ map: texture })
                    );
                    // Coordinate exactly where the whiteboard is in your screenshot
                    newBoard.position.set(0, 2.5, -5.9); 
                    // Do NOT rotate it, so it faces the camera at Z=8
                    scene.add(newBoard);
                }

                document.getElementById('loading').style.display = 'none';
            });

        }, undefined, function (error) {
            console.error("Error loading model:", error);
            document.getElementById('loading').textContent = 'Error: Please make sure "low_poly_classroom.glb" is in the same folder.';
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
